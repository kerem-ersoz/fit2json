name: Deploy FitSift frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitsift-azure-production
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment configuration
        run: |
          node - <<'NODE'
          const value = process.env.VITE_API_BASE_URL
          if (!value) throw new Error("Set the VITE_API_BASE_URL repository variable.")
          const url = new URL(value)
          if (url.protocol !== "https:" || !url.pathname.replace(/\/+$/, "").endsWith("/api")) {
            throw new Error("VITE_API_BASE_URL must be an HTTPS URL ending in /api.")
          }
          NODE

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
