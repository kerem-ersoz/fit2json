[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fit2json"
version = "0.2.0"
description = "Pull workouts from Garmin/Strava, store them as lossless JSON, and analyze them with Copilot CLI or a local LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Kerem Ersoz" },
]
dependencies = [
    "fitdecode>=0.10.0",
    "click>=8.1.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "garminconnect>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fit2json = "fit2json.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# F = pyflakes (unused imports, undefined names), I = import sorting,
# B = flake8-bugbear (likely bugs). Style/line-length (E) and pyupgrade (UP)
# can be enabled later once the codebase is modernized.
select = ["F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults (File/Query/Depends/...) are intentional
# factory calls, not the mutable-default bug B008 targets.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
# Start lenient on an existing codebase; tighten to "standard"/"strict" later.
typeCheckingMode = "basic"
