[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fit2json"
version = "0.1.0"
description = "Convert Garmin/Strava .fit files to LLM-ready JSON and analyze with GitHub Models API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Kerem Ersoz" },
]
dependencies = [
    "fitdecode>=0.10.0",
    "click>=8.1.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "garminconnect>=0.2.0",
    "stravalib>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fit2json = "fit2json.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# F = pyflakes (unused imports, undefined names), I = import sorting,
# B = flake8-bugbear (likely bugs). Style/line-length (E) and pyupgrade (UP)
# can be enabled later once the codebase is modernized.
select = ["F", "I", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
# Start lenient on an existing codebase; tighten to "standard"/"strict" later.
typeCheckingMode = "basic"
